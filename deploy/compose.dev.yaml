# Development services: PostgreSQL 16 with TimescaleDB (ARC-001 §10.1) and a local mail
# catcher standing in for the SMTP relay (plan 8.5). Start with `make db-up`.
name: pmp-dev

services:
  db:
    # Pinned to the image digest verified on 14-Oct-2026 (PostgreSQL 16.15).
    image: timescale/timescaledb:latest-pg16@sha256:6f139d56042989bd35f50ba5986e492cd32e35cc6778c50be2659add298dc09f
    environment:
      POSTGRES_USER: pmp
      POSTGRES_PASSWORD: pmp
      POSTGRES_DB: pmp
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pmp -d pmp"]
      interval: 2s
      timeout: 3s
      retries: 30

  mail:
    # Mailpit: accepts any e-mail on port 1025 and shows it at http://localhost:8025.
    # Pinned by version; pin the digest too after the first `docker pull` (as for db).
    image: axllent/mailpit:v1.21.8
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  pgdata:
