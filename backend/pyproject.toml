[project]
name = "pmp"
version = "0.1.0"
description = "Predictive Maintenance Platform: anomaly detection, health scoring and failure-risk management"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.13",
    "argon2-cffi>=23.1",
    "fastapi>=0.115",
    "openpyxl>=3.1",
    "pandas>=3.0",
    "pyarrow>=20",
    "psycopg[binary]>=3.2",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.20",
    "sqlalchemy>=2.0.30",
    "uvicorn>=0.30",
    "scikit-learn>=1.5",
]

[project.scripts]
pmp = "pmp.cli:main"

[dependency-groups]
dev = [
    "httpx2>=2.13",
    "hypothesis>=6.100",
    "import-linter>=2.1",
    "mypy>=1.11",
    "openapi-spec-validator>=0.7",
    "pandas-stubs>=2.2",
    "pip-audit>=2.7",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "types-openpyxl>=3.1",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pmp"]

# ---------------------------------------------------------------- Ruff
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "PT", "C4"]

[tool.ruff.lint.per-file-ignores]
# X for a data matrix, as in the ARC-001 §8.1 contract and scikit-learn
"pmp/modelling/algorithms/*.py" = ["N803", "N806"]
"tests/unit/test_detector_*.py" = ["N803", "N806"]

[tool.ruff.lint.isort]
known-first-party = ["pmp"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
files = ["pmp", "tests", "migrations", "tools"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*", "jsonschema", "jsonschema.*", "sklearn", "sklearn.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = [
    "integration: needs the development database (make db-up)",
]

# ---------------------------------------------------------------- coverage
# The 80% gate (NFR-MAIN-01) applies to the analytics modules; see tools/coverage_gate.py.
[tool.coverage.run]
source = ["pmp"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]

# ---------------------------------------------------------------- import-linter
# Module boundaries from PMP-ARC-001 §4.1, enforced in CI (NFR-MAIN-01).
[tool.importlinter]
root_package = "pmp"

[[tool.importlinter.contracts]]
name = "Layers: api on top, feature modules in the middle, core at the bottom"
type = "layers"
layers = [
    "pmp.api",
    "pmp.ingestion : pmp.registry : pmp.dataquality : pmp.modelling : pmp.scoring : pmp.alerting : pmp.diagnostics : pmp.prognostics : pmp.advisory : pmp.cases : pmp.notifications : pmp.reporting : pmp.demo",
    "pmp.core",
]

[[tool.importlinter.contracts]]
# ARC §4 / ADR-01: feature modules depend downward only, so there are no cycles. scoring
# calls alerting directly (not only through ScoreComputed) because ARC §5.1 needs the
# score and its alert changes in one transaction (decision 6.7).
name = "Feature modules depend downward only: diagnostics, scoring, alerting, modelling, dataquality, ingestion, registry"
type = "layers"
layers = [
    "pmp.diagnostics",
    "pmp.scoring",
    "pmp.alerting",
    "pmp.modelling",
    "pmp.dataquality",
    "pmp.ingestion",
    "pmp.registry",
]

[[tool.importlinter.contracts]]
name = "core uses other modules only through their public interface"
type = "forbidden"
source_modules = ["pmp.core"]
forbidden_modules = [
    "pmp.ingestion.**",
    "pmp.registry.**",
    "pmp.dataquality.**",
    "pmp.modelling.**",
    "pmp.scoring.**",
    "pmp.alerting.**",
    "pmp.diagnostics.**",
    "pmp.prognostics.**",
    "pmp.advisory.**",
    "pmp.cases.**",
    "pmp.notifications.**",
    "pmp.reporting.**",
    "pmp.demo.**",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "ingestion uses other modules only through their public interface"
type = "forbidden"
source_modules = ["pmp.ingestion"]
forbidden_modules = [
